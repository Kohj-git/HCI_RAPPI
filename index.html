<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오디오 녹음 및 재생</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>오디오 녹음 및 재생</h1>
        <div class="buttons">
            <button id="playMusic" class="btn">
                <span class="icon">🎵</span>
                BTS Dynamite 재생
            </button>
            <button id="recordButton" class="btn">
                <span class="icon">🎤</span>
                녹음 시작
            </button>
            <button id="playRecording" class="btn" disabled>
                <span class="icon">▶️</span>
                녹음 재생
            </button>
        </div>
        <div id="recordingStatus" class="status"></div>
        <div class="buttons">
            <button id="nextButton" class="btn" onclick="window.location.href='test.html'">
                <span class="icon">➡️</span>
                다음 페이지
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
